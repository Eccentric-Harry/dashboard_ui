<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo-192.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Dashboard" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#dfe4df" />
  <script>
    // Apply surface + theme preferences before first paint (see src/store/appearance-store.ts).
    // Dark only lands on routes reviewed for it — keep this list in sync with DARK_THEME_ROUTES.
    try {
      var root = document.documentElement;
      var themeMeta = document.querySelector('meta[name="theme-color"]');
      if (localStorage.getItem('surfaceStyle') === 'solid') {
        root.dataset.surface = 'solid';
        themeMeta.setAttribute('content', '#f5f6f8');
      }
      var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      var path = (standalone && localStorage.getItem('pwa_last_path')) || location.pathname;
      if (path === '/') path = '/home';
      if (localStorage.getItem('themePreference') === 'dark' && ['/home', '/nutrition', '/finance', '/learnings', '/tasks', '/workouts', '/calendar', '/calender', '/prompts', '/people', '/profile', '/mind'].indexOf(path) !== -1) {
        root.dataset.theme = 'dark';
        themeMeta.setAttribute('content', '#0c0d0f');
      }
    } catch (e) {}
  </script>
  <link rel="apple-touch-icon" href="/logo-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <title>Life OS</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
